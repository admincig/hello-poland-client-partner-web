stages:
  - test
  - build

variables:
  NODE_VERSION: "8"

#
# test stage tasks
#
test_project:
  stage: test
  before_script:
    - . envcfg
    - npm install
  script:
    - npm run lint
    - npm run test


#
# build stage tasks
#
build_project:
  stage: build
  artifacts:
    name: "$CI_PROJECT_NAMESPACE.$CI_PROJECT_NAME.$CI_PIPELINE_ID"
    when: on_success
    paths:
      - ./
  before_script:
    - . envcfg
    - npm install
  script:
    - npm run
  after_script:
    - rm -rf node_modules .git
    - export NODE_ENV="production"
    - npm install

#
# deploy stage tasks
#
deploy_feature:
  stage: deploy
  only:
    - /^feature\/.*$/
    - merge-requests
  when: manual
  environment:
    name: ${CI_COMMIT_REF_NAME}
    on_stop: stop_feature
  dependencies:
    - build_project
  script:
    - scp "$CI_PROJECT_NAMESPACE.$CI_PROJECT_NAME.$CI_PIPELINE_ID.zip" hpl@hpl.fream.pl:~/tmp

stop_deploy_feature:
  stage: deploy
  only:
    - /^feature\/.*$/
    - merge-requests
  when: manual
  environment:
    name: ${CI_COMMIT_REF_NAME}
    action: stop
